name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Schema validation
        run: npm run schema:check

      - name: Build
        run: npm run build

      - name: Init smoke
        run: npm run init:smoke

      - name: TypeScript compiler smoke
        run: npm run compiler:typescript:smoke

      - name: SQL compiler smoke
        run: npm run compiler:sql:smoke

      - name: Graph exporter smoke
        run: npm run compiler:graph:smoke

      - name: AIONX compiler smoke
        run: node scripts/compile-aionx-smoke.mjs
